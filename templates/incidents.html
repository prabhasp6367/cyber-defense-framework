<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidents - AI Cyber Defense Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark">
    <div class="d-flex">
        <nav class="sidebar bg-secondary bg-opacity-25 border-end border-danger" style="width: 250px; min-height: 100vh;">
            <div class="p-3 border-bottom border-danger">
                <h5 class="text-white fw-bold"><i class="fas fa-shield-alt text-danger"></i> Defense Center</h5>
            </div>
            <ul class="nav flex-column p-3">
                <li class="nav-item"><a class="nav-link text-secondary" href="/dashboard"><i class="fas fa-chart-line text-info"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/logs"><i class="fas fa-list text-success"></i> Security Logs</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/alerts"><i class="fas fa-bell text-danger"></i> Alerts</a></li>
                <li class="nav-item"><a class="nav-link text-white active" href="/incidents"><i class="fas fa-exclamation-triangle text-warning"></i> Incidents</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/analytics"><i class="fas fa-chart-bar text-info"></i> Analytics</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/response"><i class="fas fa-bolt text-success"></i> Response Center</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/logout"><i class="fas fa-sign-out-alt text-danger"></i> Logout</a></li>
            </ul>
        </nav>

        <div class="flex-grow-1 p-4">
            <h1 class="text-white fw-bold mb-1"><i class="fas fa-exclamation-triangle text-warning"></i> Security Incidents</h1>
            <p class="text-secondary mb-4">Incident management and tracking</p>

            <button class="btn btn-danger mb-4" onclick="newIncident()"><i class="fas fa-plus"></i> New Incident</button>

            <div class="bg-secondary bg-opacity-25 p-4 rounded border border-warning table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead class="table-secondary">
                        <tr>
                            <th>Incident ID</th>
                            <th>Title</th>
                            <th>Threat Type</th>
                            <th>Severity</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="incidents-table">
                        <tr><td colspan="7" class="text-center text-secondary py-4"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadIncidents);

        function loadIncidents() {
            fetch('/api/incidents')
                .then(r => r.json())
                .then(data => {
                    const tbody = document.getElementById('incidents-table');
                    tbody.innerHTML = '';
                    data.incidents.forEach(i => {
                        tbody.innerHTML += `<tr>
                            <td><strong>${i.incident_id}</strong></td>
                            <td>${i.title}</td>
                            <td>${i.threat_type}</td>
                            <td><span class="badge" style="background: ${getSeverityColor(i.severity)}">${i.severity.toUpperCase()}</span></td>
                            <td><span class="badge" style="background: ${getStatusColor(i.status)}">${i.status}</span></td>
                            <td><small>${new Date(i.created_at).toLocaleDateString()}</small></td>
                            <td><button class="btn btn-sm btn-outline-warning" onclick="editIncident(${i.id})">Edit</button></td>
                        </tr>`;
                    });
                });
        }

        function getSeverityColor(s) {
            return {critical: '#ff3333', high: '#ffaa00', medium: '#ffdd00', low: '#00ff88'}[s] || '#6c757d';
        }

        function getStatusColor(s) {
            return {open: '#ff3333', investigating: '#ffaa00', contained: '#00d4ff', resolved: '#00ff88'}[s] || '#6c757d';
        }

        function newIncident() {
            alert('Create new incident (to be implemented)');
        }

        function editIncident(id) {
            alert('Edit incident ' + id + ' (to be implemented)');
        }
    </script>
</body>
</html>
