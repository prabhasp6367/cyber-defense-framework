<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response Center - AI Cyber Defense Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark">
    <div class="d-flex">
        <nav class="sidebar bg-secondary bg-opacity-25 border-end border-danger" style="width: 250px; min-height: 100vh;">
            <div class="p-3 border-bottom border-danger"><h5 class="text-white fw-bold"><i class="fas fa-shield-alt text-danger"></i> Defense</h5></div>
            <ul class="nav flex-column p-3">
                <li class="nav-item"><a class="nav-link text-secondary" href="/dashboard"><i class="fas fa-chart-line text-info"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/alerts"><i class="fas fa-bell text-danger"></i> Alerts</a></li>
                <li class="nav-item"><a class="nav-link text-white active" href="/response"><i class="fas fa-bolt text-success"></i> Response</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/logout"><i class="fas fa-sign-out-alt text-danger"></i> Logout</a></li>
            </ul>
        </nav>
        <div class="flex-grow-1 p-4">
            <h1 class="text-white fw-bold mb-4"><i class="fas fa-bolt text-success"></i> Security Response Center</h1>
            <div class="alert alert-info"><i class="fas fa-info-circle"></i> <strong>Simulation Mode:</strong> All responses are simulated for educational purposes.</div>
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="bg-secondary bg-opacity-25 p-4 rounded border border-success">
                        <h5 class="text-white mb-3"><i class="fas fa-gamepad"></i> Simulate Response Action</h5>
                        <div class="mb-3"><label class="form-label text-secondary">Action Type</label><select class="form-select bg-secondary bg-opacity-25 text-white border-success" id="action-type"><option>block_ip</option><option>lock_account</option><option>terminate_session</option></select></div>
                        <div class="mb-3"><label class="form-label text-secondary">Target</label><input type="text" class="form-control bg-secondary bg-opacity-25 text-white border-success" id="action-target" placeholder="IP or username"></div>
                        <button class="btn btn-success w-100" onclick="simulateResponse()"><i class="fas fa-play"></i> Execute Simulation</button>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="bg-secondary bg-opacity-25 p-4 rounded border border-info">
                        <h5 class="text-white mb-3"><i class="fas fa-history"></i> Response History</h5>
                        <div id="response-history" style="max-height: 200px; overflow-y: auto;"><p class="text-secondary">Loading...</p></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadResponses);
        function simulateResponse() {
            const action = document.getElementById('action-type').value;
            const target = document.getElementById('action-target').value;
            if (!target) { alert('Enter target'); return; }
            fetch('/api/response/simulate', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({action: action, action_type: action, target: target, reason: 'Simulated response', severity: 'high'})})
                .then(r => r.json()).then(d => { alert('Response executed: ' + d.response.response_id); loadResponses(); });
        }
        function loadResponses() {
            fetch('/api/responses').then(r => r.json()).then(d => {
                const hist = document.getElementById('response-history');
                hist.innerHTML = '';
                d.responses.slice(0, 5).forEach(r => {
                    hist.innerHTML += `<div class="mb-2 p-2 bg-secondary bg-opacity-50 rounded"><small class="text-info">${r.response_id}</small><br><small class="text-success">${r.action}</small></div>`;
                });
            });
        }
    </script>
</body>
</html>
