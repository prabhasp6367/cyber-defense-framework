<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - AI Cyber Defense Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark">
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar bg-secondary bg-opacity-25 border-end border-danger" style="width: 250px; min-height: 100vh;">
            <div class="p-3 border-bottom border-danger">
                <h5 class="text-white fw-bold">
                    <i class="fas fa-shield-alt text-danger"></i> Defense Center
                </h5>
            </div>
            <ul class="nav flex-column p-3">
                <li class="nav-item"><a class="nav-link text-secondary" href="/dashboard"><i class="fas fa-chart-line text-info"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/logs"><i class="fas fa-list text-success"></i> Security Logs</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/detection"><i class="fas fa-brain text-warning"></i> Threat Detection</a></li>
                <li class="nav-item"><a class="nav-link text-white active" href="/alerts"><i class="fas fa-bell text-danger"></i> Alerts</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/incidents"><i class="fas fa-exclamation-triangle text-warning"></i> Incidents</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/analytics"><i class="fas fa-chart-bar text-info"></i> Analytics</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/response"><i class="fas fa-bolt text-success"></i> Response Center</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/logout"><i class="fas fa-sign-out-alt text-danger"></i> Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="flex-grow-1 p-4">
            <h1 class="text-white fw-bold mb-1"><i class="fas fa-bell text-danger"></i> Security Alerts</h1>
            <p class="text-secondary mb-4">Real-time threat alerts and notifications</p>

            <!-- Filter Bar -->
            <div class="row mb-4 g-2">
                <div class="col-md-4">
                    <select class="form-select bg-secondary bg-opacity-25 text-white border-danger" onchange="filterAlerts()" id="severity-filter">
                        <option value="">All Severities</option>
                        <option value="critical">Critical</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select class="form-select bg-secondary bg-opacity-25 text-white border-danger" onchange="filterAlerts()" id="status-filter">
                        <option value="">All Status</option>
                        <option value="open">Open</option>
                        <option value="investigating">Investigating</option>
                        <option value="resolved">Resolved</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-info w-100" onclick="loadAlerts()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Alerts Table -->
            <div class="bg-secondary bg-opacity-25 p-4 rounded border border-danger table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead class="table-secondary">
                        <tr>
                            <th>Alert ID</th>
                            <th>Time</th>
                            <th>Threat Type</th>
                            <th>Source IP</th>
                            <th>Risk Score</th>
                            <th>Severity</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="alerts-table">
                        <tr><td colspan="8" class="text-center text-secondary py-4"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadAlerts);

        function loadAlerts() {
            fetch('/api/alerts')
                .then(r => r.json())
                .then(data => {
                    const tbody = document.getElementById('alerts-table');
                    tbody.innerHTML = '';
                    data.alerts.forEach(a => {
                        tbody.innerHTML += `<tr>
                            <td><strong>${a.alert_id}</strong></td>
                            <td><small>${new Date(a.timestamp).toLocaleString()}</small></td>
                            <td>${a.threat_type}</td>
                            <td><code>${a.source_ip}</code></td>
                            <td><strong>${a.risk_score.toFixed(1)}</strong></td>
                            <td><span class="badge" style="background: ${getSeverityColor(a.severity)}">${a.severity.toUpperCase()}</span></td>
                            <td><span class="badge" style="background: ${getStatusColor(a.status)}">${a.status}</span></td>
                            <td><button class="btn btn-sm btn-outline-info" onclick="viewAlert(${a.id})">View</button></td>
                        </tr>`;
                    });
                });
        }

        function filterAlerts() {
            const severity = document.getElementById('severity-filter').value;
            const status = document.getElementById('status-filter').value;
            const query = `/api/alerts?${severity ? 'severity=' + severity : ''}${status ? '&status=' + status : ''}`;
            fetch(query)
                .then(r => r.json())
                .then(data => {
                    const tbody = document.getElementById('alerts-table');
                    tbody.innerHTML = '';
                    data.alerts.forEach(a => {
                        tbody.innerHTML += `<tr>
                            <td><strong>${a.alert_id}</strong></td>
                            <td><small>${new Date(a.timestamp).toLocaleString()}</small></td>
                            <td>${a.threat_type}</td>
                            <td><code>${a.source_ip}</code></td>
                            <td><strong>${a.risk_score.toFixed(1)}</strong></td>
                            <td><span class="badge" style="background: ${getSeverityColor(a.severity)}">${a.severity.toUpperCase()}</span></td>
                            <td><span class="badge" style="background: ${getStatusColor(a.status)}">${a.status}</span></td>
                            <td><button class="btn btn-sm btn-outline-info" onclick="viewAlert(${a.id})">View</button></td>
                        </tr>`;
                    });
                });
        }

        function getSeverityColor(s) {
            return {critical: '#ff3333', high: '#ffaa00', medium: '#ffdd00', low: '#00ff88'}[s] || '#6c757d';
        }

        function getStatusColor(s) {
            return {open: '#ff3333', investigating: '#ffaa00', resolved: '#00ff88'}[s] || '#6c757d';
        }

        function viewAlert(id) {
            alert('Alert ' + id + ' details (to be implemented)');
        }
    </script>
</body>
</html>
