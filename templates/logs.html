<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Logs - AI Cyber Defense Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark">
    <div class="d-flex">
        <nav class="sidebar bg-secondary bg-opacity-25 border-end border-danger" style="width: 250px; min-height: 100vh;">
            <div class="p-3 border-bottom border-danger"><h5 class="text-white fw-bold"><i class="fas fa-shield-alt text-danger"></i> Defense</h5></div>
            <ul class="nav flex-column p-3">
                <li class="nav-item"><a class="nav-link text-secondary" href="/dashboard"><i class="fas fa-chart-line text-info"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-white active" href="/logs"><i class="fas fa-list text-success"></i> Logs</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/alerts"><i class="fas fa-bell text-danger"></i> Alerts</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/incidents"><i class="fas fa-exclamation-triangle"></i> Incidents</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/analytics"><i class="fas fa-chart-bar text-info"></i> Analytics</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="/logout"><i class="fas fa-sign-out-alt text-danger"></i> Logout</a></li>
            </ul>
        </nav>
        <div class="flex-grow-1 p-4">
            <h1 class="text-white fw-bold mb-3"><i class="fas fa-list text-success"></i> Security Logs</h1>
            <div class="row mb-3">
                <div class="col-md-4"><input type="file" class="form-control bg-secondary bg-opacity-25 text-white border-success" id="csv-file" accept=".csv"></div>
                <div class="col-md-8"><button class="btn btn-success" onclick="uploadLogs()"><i class="fas fa-upload"></i> Upload CSV</button></div>
            </div>
            <div class="bg-secondary bg-opacity-25 p-4 rounded border border-success table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead class="table-secondary"><tr><th>Timestamp</th><th>Source IP</th><th>Dest IP</th><th>Port</th><th>Event Type</th><th>Status</th></tr></thead>
                    <tbody id="logs-table"><tr><td colspan="6" class="text-center py-4"><i class="fas fa-spinner fa-spin"></i></td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadLogs);
        function loadLogs() {
            fetch('/api/logs').then(r => r.json()).then(data => {
                const tbody = document.getElementById('logs-table');
                tbody.innerHTML = '';
                data.logs.forEach(l => {
                    tbody.innerHTML += `<tr><td>${new Date(l.timestamp).toLocaleString()}</td><td><code>${l.source_ip}</code></td><td><code>${l.destination_ip}</code></td><td>${l.destination_port || '-'}</td><td>${l.event_type}</td><td><span class="badge bg-success">${l.status}</span></td></tr>`;
                });
            });
        }
        function uploadLogs() {
            const file = document.getElementById('csv-file').files[0];
            if (!file) { alert('Select a file'); return; }
            const formData = new FormData();
            formData.append('file', file);
            fetch('/api/logs/upload', {method: 'POST', body: formData})
                .then(r => r.json()).then(d => { alert('Uploaded: ' + d.imported_count + ' logs'); loadLogs(); });
        }
    </script>
</body>
</html>
