<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Cyber Defense Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: rgba(30, 30, 46, 0.95);
            border: 2px solid #dc3545;
            border-radius: 10px;
            padding: 2rem;
        }
        .login-card .btn {
            border-radius: 5px;
            padding: 0.75rem;
            font-weight: 600;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #495057;
            color: white;
        }
        .form-control::placeholder {
            color: #6c757d;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #dc3545;
            color: white;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
        }
    </style>
</head>
<body class="bg-dark">
    <div class="login-container">
        <div class="login-card">
            <div class="text-center mb-4">
                <h2 class="text-white fw-bold">
                    <i class="fas fa-shield-alt text-danger"></i> Defense Center
                </h2>
                <p class="text-secondary">Secure Access</p>
            </div>

            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle"></i> {{ error }}
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            <form method="POST" class="needs-validation">
                <div class="mb-3">
                    <label for="username" class="form-label text-white">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label text-white">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 mb-3">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <hr class="text-secondary">

            <div class="alert alert-info" role="alert">
                <h6 class="text-info fw-bold mb-2"><i class="fas fa-info-circle"></i> Demo Credentials</h6>
                <p class="mb-1 small"><strong>Username:</strong> admin</p>
                <p class="mb-0 small"><strong>Password:</strong> password123</p>
            </div>

            <div class="text-center">
                <a href="/" class="text-info text-decoration-none">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
